<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12333b" />
    <meta
      name="description"
      content="来場者の情報通信路を鳥と木と霧で描く、情報通信路の大型展示画面。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/display.css?v=2" />
    <title>情報通信路 — Exhibition Display</title>
  </head>
  <body>
    <main class="exhibition" aria-labelledby="display-title">
      <canvas id="forest-canvas" aria-hidden="true"></canvas>

      <header class="display-header">
        <div class="title-block">
          <h1 id="display-title">情報通信路</h1>
        </div>
        <div class="telemetry" hidden>
          <div class="connection" aria-live="polite">
            <span id="connection-light" class="connection-light"></span>
            <span id="connection-state">接続しています</span>
          </div>
          <p id="destination-state" class="destination-state">
            DESTINATION / WAITING
          </p>
        </div>
      </header>

      <section class="observation-caption" aria-label="作品の記録">
        <dl class="observation-counts">
          <div>
            <dt>育った木</dt>
            <dd id="tree-count">0</dd>
          </div>
          <div>
            <dt>届いた経路</dt>
            <dd id="route-count">0</dd>
          </div>
        </dl>
      </section>

      <aside class="join-qr-panel" aria-label="スマートフォンから参加">
        <img
          class="join-qr"
          src="/qr.svg"
          width="212"
          height="212"
          alt="参加ページ https://route-forest.wowazun.net のQRコード"
        />
        <p>スマートフォンで読み取ってください</p>
      </aside>

      <aside
        id="performance-monitor"
        class="performance-monitor"
        aria-label="描画性能"
        hidden
      >
        <div class="performance-heading">
          <div>
            <p>FIELD LOAD / FRAME PULSE</p>
            <h2>描画性能検証</h2>
          </div>
          <strong id="performance-status">準備中</strong>
        </div>
        <dl class="performance-metrics">
          <div>
            <dt>平均 FPS</dt>
            <dd id="performance-fps">—</dd>
          </div>
          <div>
            <dt>P95 FRAME</dt>
            <dd><span id="performance-p95">—</span><small> ms</small></dd>
          </div>
          <div>
            <dt>最大 FRAME</dt>
            <dd><span id="performance-max">—</span><small> ms</small></dd>
          </div>
          <div>
            <dt>長い処理</dt>
            <dd id="performance-long-tasks">0</dd>
          </div>
        </dl>
        <div
          id="performance-pulse"
          class="performance-pulse"
          aria-hidden="true"
        ></div>
        <p id="performance-profile" class="performance-profile"></p>
        <p class="performance-target">
          基準 / 50 FPS以上・P95 25ms以下（1920×1080）
        </p>
      </aside>

      <p id="empty-message" class="empty-message" hidden></p>
    </main>
    <script type="module" src="/display.js?v=31"></script>
  </body>
</html>
