<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b252c" />
    <meta
      name="description"
      content="渡り路の展示データをまっさらにする操作画面"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin-reset.css?v=2" />
    <title>展示データをまっさらにする — 渡り路</title>
  </head>
  <body>
    <main class="reset-console">
      <header class="reset-heading">
        <p class="work-title">渡り路 / MAINTENANCE</p>
        <h1>展示をまっさらにする</h1>
        <p>
          これまでに育った森と通信の記録を消し、
          展示開始前と同じ状態へ戻します。
        </p>
      </header>

      <section class="reset-step" aria-labelledby="reset-title">
        <p class="step-number">RESET EXHIBITION</p>
        <h2 id="reset-title">消えるもの</h2>
        <ul class="reset-impact">
          <li>届いた経路と木の成長</li>
          <li>参加中のスマートフォン接続</li>
          <li>鳥、種、羽、手紙、紙飛行機などの画面上の演出</li>
          <li>参加者ごとの再参加待ち時間</li>
        </ul>
        <p class="warning">
          この操作は取り消せません。ボタンを押すと確認画面が表示されます。
        </p>
        <button id="execute-reset" class="danger-action" type="button">
          展示をまっさらにする
        </button>
      </section>

      <p id="reset-status" class="reset-status" aria-live="polite">
        まだ何も変更されていません。
      </p>
    </main>
    <script type="module" src="/admin-reset.js?v=2"></script>
  </body>
</html>
